<body>
<nav>
  <div class="logo">LINK RENTAL</div>
  <div class="nav-links">
    <a href="index.html#top">Home</a>
    <a href="index.html#properties">Properties</a>
    <a href="index.html#cars">Cars</a>
    <a href="index.html#contact">Contact</a>
  </div>

<main class="form-page">
  <div class="form-container">
    <h1>List your property or car</h1>
    <p>Fill in the details below. We open WhatsApp with your message ready to send, and you attach your photos in the chat.</p>
    <form id="ownerForm">
      <label for="ownerName">Your name</label>
      <input id="ownerName" required autocomplete="name">
      <label for="ownerPhone">Your phone number</label>
      <input id="ownerPhone" type="tel" required autocomplete="tel">
      <label for="listingType">What are you listing?</label>
      <select id="listingType" required>
        <option>House or apartment to rent</option>
        <option>Short stay (Airbnb)</option>
        <option>Car for rent</option>
      </select>
      <label for="listingName">Name of the listing</label>
      <input id="listingName" placeholder="e.g. Modern 2 bedroom apartment" required>
      <label for="listingLocation">Location</label>
      <input id="listingLocation" placeholder="e.g. Mikocheni" required>
      <label for="listingPrice">Price you want (TZS) and how often</label>
      <input id="listingPrice" placeholder="e.g. 900,000 per month" required>
      <label for="description">Description</label>
      <textarea id="description" rows="4" placeholder="Bedrooms, bathrooms, seats, anything customers should know"></textarea>
      <button type="submit">Send on WhatsApp</button>
      <p id="formMessage" role="status"></p>
    </form>
  </div>
</main>
